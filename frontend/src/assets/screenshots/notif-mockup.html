<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 390px;
    height: 844px;
    background: #1a1a1a;
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Wallpaper gradient */
  .wallpaper {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #1c1a2e 0%, #0e1520 40%, #1a1410 100%);
  }

  /* Subtle texture */
  .wallpaper::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 20% 30%, rgba(123,127,224,0.18) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(180,140,80,0.10) 0%, transparent 50%);
  }

  /* Dynamic Island */
  .dynamic-island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 37px;
    background: #000;
    border-radius: 20px;
    z-index: 10;
  }

  /* Status bar */
  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 59px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 28px 8px;
    z-index: 9;
  }
  .status-time {
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.3px;
  }
  .status-icons {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .status-icons svg { opacity: 0.95; }

  /* Lock time */
  .lock-time {
    position: absolute;
    top: 100px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 5;
  }
  .lock-time .time {
    font-size: 78px;
    font-weight: 300;
    color: #fff;
    letter-spacing: -3px;
    line-height: 1;
  }
  .lock-time .date {
    font-size: 17px;
    color: rgba(255,255,255,0.75);
    margin-top: 4px;
    font-weight: 400;
    letter-spacing: 0.1px;
  }

  /* Notification card */
  .notif-card {
    position: absolute;
    top: 310px;
    left: 16px;
    right: 16px;
    background: rgba(30, 28, 38, 0.88);
    backdrop-filter: blur(40px) saturate(1.8);
    -webkit-backdrop-filter: blur(40px) saturate(1.8);
    border-radius: 20px;
    padding: 14px 16px 16px;
    border: 0.5px solid rgba(255,255,255,0.12);
    z-index: 20;
  }

  .notif-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .notif-icon {
    width: 32px;
    height: 32px;
    background: #7B7FE0;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-weight: 700;
    font-size: 14px;
    color: #1a1a2e;
    transform: rotate(-6deg);
  }

  .notif-app-name {
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    font-weight: 500;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    flex: 1;
  }

  .notif-time {
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    font-weight: 400;
  }

  .notif-title {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    line-height: 1.3;
    margin-bottom: 3px;
    letter-spacing: -0.2px;
  }

  .notif-body {
    font-size: 15px;
    font-weight: 400;
    color: rgba(255,255,255,0.72);
    line-height: 1.35;
    letter-spacing: -0.1px;
  }

  /* Second notification (older, smaller) */
  .notif-card-2 {
    position: absolute;
    top: 445px;
    left: 24px;
    right: 24px;
    background: rgba(30, 28, 38, 0.72);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-radius: 18px;
    padding: 12px 14px;
    border: 0.5px solid rgba(255,255,255,0.08);
    z-index: 19;
  }

  .notif-card-2 .notif-header { margin-bottom: 7px; }
  .notif-card-2 .notif-title { font-size: 14px; }
  .notif-card-2 .notif-body { font-size: 14px; color: rgba(255,255,255,0.60); }

  /* Bottom bar */
  .bottom-bar {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: rgba(255,255,255,0.4);
    border-radius: 3px;
  }
</style>
</head>
<body>
  <div class="wallpaper"></div>

  <div class="dynamic-island"></div>

  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <!-- Signal -->
      <svg width="17" height="12" viewBox="0 0 17 12" fill="white">
        <rect x="0" y="3" width="3" height="9" rx="1"/>
        <rect x="4.5" y="2" width="3" height="10" rx="1"/>
        <rect x="9" y="0.5" width="3" height="11.5" rx="1"/>
        <rect x="13.5" y="0.5" width="3" height="11.5" rx="1" opacity="0.3"/>
      </svg>
      <!-- WiFi -->
      <svg width="16" height="12" viewBox="0 0 16 12" fill="white">
        <path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
        <path d="M8 6C6.1 6 4.4 6.8 3.2 8.1l1.4 1.4C5.5 8.6 6.7 8 8 8s2.5.6 3.4 1.5l1.4-1.4C11.6 6.8 9.9 6 8 6z" opacity="0.7"/>
        <path d="M8 2.5C5.1 2.5 2.5 3.7.8 5.7l1.5 1.5C3.7 5.5 5.7 4.5 8 4.5s4.3 1 5.7 2.7l1.5-1.5C13.5 3.7 10.9 2.5 8 2.5z" opacity="0.4"/>
      </svg>
      <!-- Battery -->
      <svg width="25" height="12" viewBox="0 0 25 12" fill="white">
        <rect x="0" y="1" width="21" height="10" rx="3" stroke="white" stroke-width="1" fill="none"/>
        <rect x="22" y="3.5" width="2" height="5" rx="1" fill="white" opacity="0.5"/>
        <rect x="1.5" y="2.5" width="15" height="7" rx="2" fill="white"/>
      </svg>
    </div>
  </div>

  <div class="lock-time">
    <div class="time">9:41</div>
    <div class="date">Jueves, 19 de junio</div>
  </div>

  <!-- Main notification -->
  <div class="notif-card">
    <div class="notif-header">
      <div class="notif-icon">L</div>
      <span class="notif-app-name">Lenzu</span>
      <span class="notif-time">ahora</span>
    </div>
    <div class="notif-title">Alex Obregon</div>
    <div class="notif-body">Aviso: movimos la ceremonia a las 4:30 pm. Revisa el timeline actualizado.</div>
  </div>

  <!-- Second notification -->
  <div class="notif-card-2">
    <div class="notif-header">
      <div class="notif-icon" style="width:28px;height:28px;font-size:12px;">L</div>
      <span class="notif-app-name">Lenzu</span>
      <span class="notif-time">10 min</span>
    </div>
    <div class="notif-title">Alex Obregon</div>
    <div class="notif-body">La recepción empieza a las 7:00 pm. Nos vemos en el jardín principal.</div>
  </div>

  <div class="bottom-bar"></div>
</body>
</html>
