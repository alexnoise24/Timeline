<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Primary Meta Tags -->
    <title>Lenzu — Timelines for Photographers</title>
    <meta name="title" content="Lenzu — Timelines for Photographers" />
    <meta name="description" content="Plan and run your wedding day with Lenzu. Timelines, shot lists and collaboration for photographers." />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#7B7FE0" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lenzu" />

    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#7B7FE0" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />

    <!-- Prevent iOS auto-zoom on input focus (requires font-size >= 16px) -->
    <style>
      input, textarea, select { font-size: max(16px, 1em) !important; }
    </style>

    <!-- iOS nativo puede disparar estos eventos antes de que React monte sus
         listeners (la app carga lenzu.app remoto); se capturan aquí y
         NotificationHandler los procesa al montar. Capacitor copia los datos
         directo sobre el evento (e.token), no en e.detail -->
    <script>
      // TEMP DEBUG: beacons de diagnóstico FCM, solo en la app nativa (quitar al verificar push)
      var __lenzuDbg = function (stage) {
        if (!window.Capacitor && !/Capacitor/.test(navigator.userAgent)) return;
        try { fetch('/api/email-track/debug/' + stage, { cache: 'no-store' }).catch(function () {}); } catch (err) {}
      };
      __lenzuDbg('head-script-loaded');
      window.addEventListener('nativeFCMToken', function (e) {
        var token = e.token || (e.detail && e.detail.token);
        __lenzuDbg(token ? 'event-token-ok' : 'event-token-empty');
        if (token) window.__lenzuPendingFCMToken = token;
      });
      window.addEventListener('pushNotificationTap', function (e) {
        var url = e.url || (e.detail && e.detail.url);
        if (url) window.__lenzuPendingTapUrl = url;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
